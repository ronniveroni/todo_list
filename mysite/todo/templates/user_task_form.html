{% extends 'base.html' %}


{% block title %} Create/Update {% endblock %}

{% block content %}
<h1>Create & Update task</h1>
<form method="post">
    {% csrf_token %}
    {% load crispy_forms_tags %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
