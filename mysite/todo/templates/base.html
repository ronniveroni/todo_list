<!DOCTYPE html>
<html lang="en">
<head>
  <title>{% block title %} {% endblock %}</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
     {% load static %}
    <link rel="stylesheet" href ="{% static 'css/styles.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark shadow">
  <div class="container-fluid">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link active" href="#">Pradžia</a>
      </li>
    </ul>
  </div>
</nav>

<div class="py-5 text-white"
     style="background: linear-gradient(135deg, #0d6efd, #6610f2);">
    <div class="container text-center">
        <h1 class="display-2 fw-bold">🚀 Daily Task Manager</h1>

        <p class="lead mt-3">
            Manage your work, track progress, and stay focused every day.
        </p>
    </div>
</div>

<div class="container mt-5">
  <div class="row">
    <div class="col-sm-8">
        {% block content %} {% endblock %}
    </div>
  </div>
</div>

<div class="mt-5 p-4 bg-dark text-white text-center">
  <p>TODO App</p>
</div>

</body>
</html>
